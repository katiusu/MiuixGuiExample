name: android-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "runner sdk: $SDK"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd /tmp
            curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q cmdtools.zip -d cmdline-tools-tmp
            mkdir -p "$SDK/cmdline-tools"
            mv cmdline-tools-tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-37.2" > /tmp/sdk.log 2>&1 || (tail -40 /tmp/sdk.log; exit 1)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/b.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/b.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          errs = [l for l in lines if l.startswith('e: ') or 'Unresolved reference' in l]
          if errs:
              msg = '\n'.join(errs[:60])
          else:
              idx = next((i for i, l in enumerate(lines) if 'What went wrong' in l or 'FAILURE:' in l), None)
              msg = '\n'.join(lines[idx:idx+45]) if idx is not None else '\n'.join(lines[-45:])
          msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error::' + msg)
          PY
          exit 1

      - name: Verify APK
        if: success()
        run: |
          APK=$(find . -name '*.apk' -path '*debug*' | head -1)
          test -n "$APK"
          SIZE=$(stat -c%s "$APK")
          ENTRIES=$(unzip -l "$APK" | tail -1 | awk '{print $2}')
          MANIFEST=$(unzip -l "$APK" | grep -c 'AndroidManifest.xml')
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "::notice::APK $APK bytes=$SIZE entries=$ENTRIES manifest=$MANIFEST sha256=$SHA"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
