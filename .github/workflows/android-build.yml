name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SM}" ]; then
            echo "cmdline-tools missing, installing"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "${SDK_ROOT}/cmdline-tools"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "sdkmanager: ${SM}"
          yes | "${SM}" --licenses > /tmp/lic.log 2>&1 || true
          if ! "${SM}" "platform-tools" "build-tools;36.0.0" "platforms;android-37.2" > /tmp/sdk.log 2>&1; then
            tail -40 /tmp/sdk.log
            exit 1
          fi
          tail -5 /tmp/sdk.log
          ls "${SDK_ROOT}/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/b.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          p = "/tmp/b.log"
          lines = open(p, encoding="utf-8", errors="replace").read().splitlines() if os.path.exists(p) else []
          errs = [l for l in lines if l.startswith("e: ") or "Unresolved reference" in l]
          if errs:
              for l in errs[:40]:
                  print("::error::" + l.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          else:
              idx = [i for i, l in enumerate(lines) if "What went wrong" in l or "FAILURE:" in l]
              start = idx[0] if idx else max(0, len(lines) - 45)
              for l in lines[start:start + 45]:
                  print("::error::" + l.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: Verify APK
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          python3 - "$APK" <<'PY'
          import sys, zipfile, hashlib, os
          p = sys.argv[1]
          z = zipfile.ZipFile(p)
          names = z.namelist()
          print("::notice::APK bytes=${os.path.getsize(p)} entries=${len(names)} manifest=${int('AndroidManifest.xml' in names)} arsc=${int('resources.arsc' in names)} sha256=${hashlib.sha256(open(p,'rb').read()).hexdigest()}")
          PY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
