name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SM}" ]; then
            echo "cmdline-tools missing, installing"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "${SDK_ROOT}/cmdline-tools"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "sdkmanager: ${SM}"
          yes | "${SM}" --licenses > /tmp/lic.log 2>&1 || true
          if ! "${SM}" "platform-tools" "build-tools;36.0.0" "platforms;android-37.2" > /tmp/sdk.log 2>&1; then
            tail -40 /tmp/sdk.log
            exit 1
          fi
          tail -5 /tmp/sdk.log
          ls "${SDK_ROOT}/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/b.log
          echo "--- apk outputs ---"
          find app/build/outputs -name '*.apk' -exec ls -l {} + || true

      - name: Report build errors
        if: failure()
        run: |
          LOG=/tmp/b.log
          if [ ! -f "$LOG" ]; then echo "::error::no build log"; exit 0; fi
          ERRS=$(grep -c '^e: ' "$LOG" || true)
          if [ "$ERRS" -gt 0 ]; then
            grep '^e: ' "$LOG" | head -40 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::${l}"; done
          else
            tail -45 "$LOG" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::${l}"; done
          fi

      - name: Verify APK
        if: success()
        run: |
          APK=$(find app/build/outputs -name '*.apk' | head -1)
          if [ -z "${APK}" ]; then
            echo "::error::no apk produced under app/build/outputs"
            find app/build/outputs -maxdepth 4 | head -40 || true
            exit 1
          fi
          SIZE=$(stat -c %s "${APK}")
          ENTRIES=$(unzip -l "${APK}" | wc -l)
          MANIFEST=$(unzip -l "${APK}" | grep -c 'AndroidManifest.xml' || true)
          ARSC=$(unzip -l "${APK}" | grep -c 'resources.arsc' || true)
          SHA=$(sha256sum "${APK}" | cut -d' ' -f1)
          echo "APK=${APK}"
          if [ "${MANIFEST}" = "0" ] || [ "${ARSC}" = "0" ]; then
            echo "::error::apk missing AndroidManifest.xml or resources.arsc"
            exit 1
          fi
          echo "::notice::APK bytes=${SIZE} entries=${ENTRIES} manifest=${MANIFEST} arsc=${ARSC} sha256=${SHA}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error