# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

# 本机 Android SDK（本容器已预装；不用 local.properties，避免路径漂移）

# 关闭 release 资源优化（aapt2 optimize + proto 格式链路）。
# 原因：本容器只能用 build-tools 36.0.0 的 aarch64 aapt2（37.0.0 只有 x86_64 产物），
# 该版本下 optimizeReleaseResources 会静默产出空的 resources-release-optimize.ap_，
# 于是 packageRelease 打出一个没有 AndroidManifest.xml / resources.arsc 的坏 APK（安装失败）。
# 关掉后 release 与 debug 走同一条资源打包链路（已实测可用），只损失一点包体，不影响运行性能。
# 在工具链正常的机器上可以删掉这一行。
android.enableResourceOptimizations=false

# 配置缓存
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
